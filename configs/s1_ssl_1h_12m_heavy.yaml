# S1 Phase A (1h) вЂ” HEAVY model config.
# see docs/S1_HEAVY_MODEL.md for rationale, goals and risks.
seed: 0
device: cuda
epochs: 5
# reduced batch for the larger activations of the heavy vision stack
batch_size: 64
chart_window: 128
image_size: 128

model:
  embed_dim: 384
  vision_channels: [64, 128, 256, 384]
  numeric_layers: 4
  fusion_layers: 4
  memory_layers: 4
  memory_max_len: 128
  n_instruments: 12
  encoder_ff_mult: 4.0
  dropout: 0.1

optim:
  lr: 0.0003
  weight_decay: 0.0001
  warmup_steps: 500

ssl:
  projection_dim: 128
  hidden_dim: 256
  temperature: 0.1
  # higher masking for a heavier encoder -> stronger reconstruction signal
  mask_ratio: 0.5
  ema_decay: 0.996
  weight_temporal: 1.0
  weight_masked: 1.0
  weight_alignment: 0.5
  grad_clip: 1.0
  log_every: 50
  temporal_horizon: 4
  val_max_batches: 64
  checkpoint_every_steps: 500
  use_ema_teacher: true
  use_masked_modeling: true
  use_temporal_contrast: true
  use_cross_modal: true